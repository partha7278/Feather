{{define "content"}}
<div class="card auth-card">
  <header class="auth-head">
    <h2 id="login-title">Sign in</h2>
    <p class="hint">Use the administrator account created during setup.</p>
  </header>

  <form method="post" action="/login" class="auth-form" aria-labelledby="login-title">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <input type="hidden" name="next" value="{{.Data.Next}}">

    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" value="{{.Data.Email}}" required autofocus autocomplete="username">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>

    <button class="btn primary block" type="submit">Sign in</button>
  </form>
</div>

<p class="small dim auth-foot">
  Locked out? Run <code>feather reset-password &lt;email&gt;</code> on the server.
</p>
{{end}}
