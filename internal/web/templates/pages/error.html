{{define "content"}}
<div class="card error-card">
  <span class="error-mark" aria-hidden="true">{{template "icon-alert"}}</span>
  <h2 id="error-title">{{.Data.Heading}}</h2>
  <p class="error-message">{{.Data.Message}}</p>
  {{if .Data.Detail}}
    <pre class="code error-detail">{{.Data.Detail}}</pre>
  {{end}}
  <div class="button-row">
    <a class="btn primary" href="{{.Data.Back}}">{{template "icon-arrow-left"}} Go back</a>
    <a class="btn ghost" href="/">Overview</a>
  </div>
</div>
{{end}}
