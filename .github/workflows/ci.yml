name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # A CVE lands in a dependency without anyone touching this repository, so the
  # vulnerability scan has to run on a clock, not only on a push.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  GO_VERSION: "1.26.6"

jobs:
  check:
    name: vet, lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "These files are not gofmt'd:"
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # -race because App.running, Registry.byAlias and Scheduler.entries are
      # all hand-guarded by mutexes; -count=1 so a cached pass cannot hide a
      # regression.
      - name: go test -race
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -1

  # The end-to-end suite: archive to real object storage, verify, delete, and
  # restore. This is the job that proves the durability guarantee, so it gates
  # the build rather than running as an optional extra.
  integration:
    name: end-to-end (mongo + postgres + minio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: start the rig
        run: docker compose -f testdata/docker-compose.yml up -d --wait

      - name: seed
        run: go run ./testdata/seed -n 5000

      - name: go test -tags=integration
        env:
          FEATHER_TEST_MONGO_URI: mongodb://127.0.0.1:27018
          FEATHER_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          FEATHER_TEST_POSTGRES_DSN: postgres://feather:feather@127.0.0.1:5433/feather?sslmode=disable
          # CI starts the rig on purpose, so a rig that is not up is a failure,
          # not a reason to pass quietly.
          FEATHER_TEST_REQUIRE_RIG: "1"
        run: go test -race -count=1 -tags=integration -timeout 20m ./internal/e2e/... ./internal/pgsrc/... ./internal/runner/...

      - name: rig logs on failure
        if: failure()
        run: docker compose -f testdata/docker-compose.yml logs

      - name: stop the rig
        if: always()
        run: docker compose -f testdata/docker-compose.yml down -v

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "(devel)")
          PKG=github.com/unifers/feather/internal/buildinfo
          go build -trimpath -ldflags="-s -w \
            -X $PKG.version=$VERSION \
            -X $PKG.commit=$GITHUB_SHA \
            -X $PKG.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "bin/feather-${GOOS}-${GOARCH}" ./cmd/feather

      - uses: actions/upload-artifact@v4
        with:
          name: feather-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/feather-*

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Builds linux/amd64 and linux/arm64 on every run; pushes to Docker Hub only
  # for pushes to main or a v* tag, and only once the checks and tests pass.
  # Needs repo variable DOCKERHUB_USERNAME and secret DOCKERHUB_TOKEN.
  docker:
    name: docker build and push
    runs-on: ubuntu-latest
    needs: [check, test, integration]
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME || 'unifers' }}/feather
          # v1.2.3 -> 1.2.3, 1.2, 1 and latest; main -> main; every push -> sha-<short>.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
