# Local verification rig for feather. Not for production use.
# PostgreSQL listens on 5433 so it does not collide with a local server.
#   docker compose -f testdata/docker-compose.yml up -d
#
# MinIO stands in for both S3 accounts and for Oracle Object Storage: all three
# speak the same API, and MinIO exercises the non-AWS code path (custom
# endpoint, path-style addressing, relaxed request checksums) that the real OCI
# endpoint needs.
services:
  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    command: ["--quiet"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      timeout: 5s
      retries: 20

  postgres:
    # 12 is the oldest feather supports (it reads pg_attribute.attgenerated);
    # the rig runs a current release.
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: feather
      POSTGRES_PASSWORD: feather
      POSTGRES_DB: feather
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "feather"]
      interval: 3s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: featherkey
      MINIO_ROOT_PASSWORD: feathersecret
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 20

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 featherkey feathersecret;
      mc mb -p local/feather-primary;
      mc mb -p local/feather-backup;
      mc mb -p local/feather-cold;
      echo 'buckets ready';
      "
